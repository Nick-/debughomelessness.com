name: Deploy Cloudflare Worker

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run db:migrate:local
      - name: Test the Workers runtime and SPA routing
        run: |
          npx wrangler dev --ip 127.0.0.1 --port 8787 > /tmp/wrangler.log 2>&1 &
          WORKER_PID=$!
          trap 'kill "$WORKER_PID" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/health > /dev/null; then break; fi
            sleep 1
          done
          npm run smoke -- http://127.0.0.1:8787

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Set the production CLOUDFLARE_API_TOKEN secret'; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = "9266560766d3741dd4f51cc302ba9caa" || { echo 'Set production CLOUDFLARE_ACCOUNT_ID to the configured domain-owning account'; exit 1; }
      - run: npm run build
      - run: npm run db:migrate:remote
      - run: npm run deploy:worker
      - run: npm run smoke
