# ETL Pipeline Configuration

# Data source configuration
data_sources:
  hud:
    base_url: "https://files.hudexchange.info/resources/documents/"
    pit_years: [2021, 2022, 2023]
    spm_years: [2021, 2022, 2023]
    
# File paths
paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  logs: "logs"
  
# Database configuration
database:
  host: "${DB_HOST:localhost}"
  port: "${DB_PORT:5432}"
  name: "${DB_NAME:homelessness_kpi}"
  user: "${DB_USER:postgres}"
  password: "${DB_PASSWORD:postgres}"
  
# Processing options
processing:
  chunk_size: 1000
  skip_duplicates: true
  validate_data: true
  
# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/etl.log"